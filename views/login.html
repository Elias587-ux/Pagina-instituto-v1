<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso Administrativo · IES N° 11</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#313E59">
  <link rel="icon" href="/assets/logo-ies11.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body>
  <div class="auth-page">
    <aside class="auth-aside">
      <a class="brand" href="/">
        <img src="/assets/logo-ies11.svg" alt="" width="48" height="48">
        <span>
          <span class="brand__name">IES N° 11</span>
          <span class="brand__sub">Panel de gestión de contenidos</span>
        </span>
      </a>
      <p class="auth-aside__quote">Formando profesionales con <em>compromiso social.</em></p>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <span class="section__eyebrow">Acceso administrativo</span>
        <h1>Iniciar sesión</h1>
        <p class="muted">Ingresá con tu cuenta institucional para gestionar noticias, calendario, trámites y alertas del sitio.</p>

        <form id="loginForm" novalidate>
          <div class="form-alert" id="loginError" role="alert" hidden></div>
          <div class="field">
            <label class="field__label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label class="field__label" for="password">Contraseña</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn--brand btn--block" type="submit" id="loginSubmit">Ingresar</button>
        </form>

        <a class="auth-card__back" href="/"><span data-icon="arrow-left"></span>Volver al sitio</a>
      </div>
    </main>
  </div>
</body>
</html>
